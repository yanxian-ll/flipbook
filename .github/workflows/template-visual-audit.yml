name: Template visual audit

on:
  push:
    paths:
      - .github/workflows/template-visual-audit.yml

jobs:
  package-template-overlays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: template-overlays
          path: public/reference/templates/*.png
          if-no-files-found: error
          retention-days: 1
