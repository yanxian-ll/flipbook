name: Generate cleaned template overlays

on:
  push:
    paths:
      - .github/workflows/template-visual-audit.yml
      - scripts/clean-template-overlays.py
      - src/domain/templates/overlay-texts.json

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Generate cleaned overlays
        run: python scripts/clean-template-overlays.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit generated overlays
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/reference/templates-clean
          if git diff --cached --quiet; then
            echo "Generated overlays already up to date."
          else
            git commit -m "chore: generate cleaned editable-text overlays"
            git push origin HEAD:main
          fi
