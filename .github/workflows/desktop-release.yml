name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'electron/**'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win nsis --x64
            artifact: windows-x64
            files: release/*.exe
          - name: macOS Intel + Apple Silicon
            os: macos-latest
            args: --mac dmg --x64 --arm64
            artifact: macos
            files: release/*.dmg
          - name: Linux x64
            os: ubuntu-latest
            args: --linux AppImage --x64
            artifact: linux-x64
            files: release/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web renderer
        run: npm run build

      - name: Build desktop package
        run: npx --yes electron-builder@26.16.1 ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Flipbook Studio ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
